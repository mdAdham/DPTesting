<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>
<body>
    <h1>Student List</h1>
    <table border="1">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Age</th>
        </thead>
        <tbody>
            {%for s in stu%}
            <tr>
                <td>{{s.ID}}</td>
                <td>{{s.STUDENTNAME}}</td>
                <td>{{s.COURSENAME}}</td>
                <td>{{s.AGE}}</td>
                <a href="#">Edit</a>
                <a href="#">Delete</a>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
