<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>
<body>
    <h1>Student List</h1>
    <a href="/add"><h2>Add Student</h2></a>
    <table border="1">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Age</th>
            <th>Edit</th>
            <th>Delete</th>
        </thead>
        <tbody>
            {%for s in stu%}
            <tr>
                <td>{{s.ID}}</td>
                <td>{{s.STUDENTNAME}}</td>
                <td>{{s.COURSENAME}}</td>
                <td>{{s.AGE}}</td>
                <td><a href="/edit/{{s.ID}}">Edit</a></td>
                <td><a href="/removestu/{{s.ID}}" onclick="return confirm('Are you sure want to delete')">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
